model:
  name: Horus-Taleeq-0.2-base
  language: ar
  arabic_only: true
  architecture: llama_decoder_only
  vocab_size: 128000
  hidden_size: 640
  intermediate_size: 2048
  num_hidden_layers: 24
  num_attention_heads: 10
  num_key_value_heads: 2
  max_position_embeddings: 4096
  rope_theta: 1000000.0
  tie_word_embeddings: true
  dtype: bfloat16

tokenizer:
  type: sentencepiece
  path: tokenizer/nour_flash_128k.model
  vocab_size: 128000

training:
  initial_sequence_length: 2048
  optimizer: AdamW
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.1
  gradient_clip_norm: 1.0
  gradient_checkpointing: true
  core_pretraining_token_ids: 6000308224
  context_continuation_token_ids: 100007936
  clean_repair_token_ids: 400007168

release:
  license: MIT
  owner: Assem Sabry
  organization: TokenAI
